name: nori-tura

services:
  postgres:
    image: postgres:16-alpine
    container_name: nonitura-postgres
    environment:
      POSTGRES_USER: nonitura
      POSTGRES_PASSWORD: nonitura123
      POSTGRES_DB: nonitura
    volumes:
      - nonitura_postgres_data:/var/lib/postgresql/data
    networks:
      - nonitura-network
      - prime-world-crm_prime-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nonitura -d nonitura"]
      interval: 10s
      timeout: 5s
      retries: 5
    # No host port mapping; keeps 5432 free for Prime World Ledger.

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: nonitura-minio
    environment:
      MINIO_ROOT_USER: nonitura
      MINIO_ROOT_PASSWORD: nonitura123
    ports:
      - "9500:9000"
    volumes:
      - nonitura_minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - nonitura-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Host port 9500 exposes the S3 API directly (http://<server-ip>:9500) so
    # the mobile app can load presigned media URLs. Console (9001) is not
    # exposed publicly — use `docker compose exec minio` or an SSH tunnel.

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nonitura-api
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - nonitura-network
      - prime-world-crm_prime-network
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=prime-world-crm_prime-network"
      - "traefik.http.routers.noritura.rule=Host(`nori-tura.primeworld.tech`)"
      - "traefik.http.routers.noritura.entrypoints=websecure"
      - "traefik.http.routers.noritura.tls.certresolver=myresolver"
      - "traefik.http.services.noritura.loadbalancer.server.port=8000"
      # Optional middleware: strip any unexpected prefixes (none expected here)
      - "traefik.http.routers.noritura.middlewares=noni-tura-security-headers"
      - "traefik.http.middlewares.noni-tura-security-headers.headers.customFrameOptionsValue=DENY"
      - "traefik.http.middlewares.noni-tura-security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.noni-tura-security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.noni-tura-security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G

volumes:
  nonitura_postgres_data:
  nonitura_minio_data:

networks:
  nonitura-network:
    driver: bridge
  prime-world-crm_prime-network:
    external: true
