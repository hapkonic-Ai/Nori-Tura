version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nonitura-postgres
    environment:
      POSTGRES_USER: nonitura
      POSTGRES_PASSWORD: nonitura123
      POSTGRES_DB: nonitura
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: nonitura-minio
    environment:
      MINIO_ROOT_USER: nonitura
      MINIO_ROOT_PASSWORD: nonitura123
    ports:
      - "9100:9000"
      - "9101:9001"
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/9000'"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  minio_data:
